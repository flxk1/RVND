name: release-dependencies

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  all-extras:
    name: all extras / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64-py312
          - os: macos-14
            platform: macos-arm64-py312
          - os: windows-latest
            platform: windows-x86_64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: resolve every optional dependency
        run: >-
          python -m pip install
          --dry-run --ignore-installed
          --report pip-report.json
          ".[test,llm,onnx,build,extractors]"
      - name: build hash lock, CycloneDX SBOM, and notices
        run: >-
          python scripts/release_dependency_artifacts.py
          --pip-report pip-report.json
          --platform ${{ matrix.platform }}
          --output-dir release-dependencies
      - name: upload platform release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dependencies-${{ matrix.platform }}
          path: release-dependencies/*
          if-no-files-found: error

  attach-to-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: all-extras
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-dependencies-*
          path: release-dependencies
          merge-multiple: true
      - name: create release or attach dependency evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-dependencies/* --clobber
