#
# Does the documented install still work today?
#
# `ci` proves the tree is sound at the commit that triggered it. It cannot
# catch an install that breaks because something upstream published a new
# release — nothing pushed, so nothing ran. That is exactly how `mcp` 2.0.0
# (2026-07-28) removed `mcp.server.fastmcp` and left `pip install -e .`
# resolving a version Rvnd cannot import, with a green ci behind it.
#
# So this workflow runs on a schedule as well as on changes, and it runs the
# README installer rather than a curated subset. Actions checkout supplies the
# clone step; then the same installer shown to users creates the venv, installs
# from the working tree, and proves the engine works. A failure here means a
# new user cannot install Rvnd today.
#
# The floor is covered deliberately. `requires-python` claims >=3.10 while ci
# pins 3.12, so 3.10 is asserted nowhere else; a 3.11-only construct would
# ship unnoticed.
#
# Windows is out of scope: the venv layout differs (Scripts/) and the README
# already states the quick start describes a POSIX environment.
name: install-matrix

on:
  schedule:
    # 06:00 UTC daily — upstream releases land overnight in EU hours.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "app/serve.py"
      - "server/src/**"
      - "server/install.sh"
      - "README.md"
      - ".github/workflows/install-matrix.yml"
  # Every pull request must emit the quick-start checks because they are
  # required by the main-branch ruleset.  A path filter here leaves otherwise
  # healthy PRs permanently blocked with required checks that never exist.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-start:
    name: quick start (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One broken cell must not mask the others: a failure specific to the
      # 3.10 floor and a failure specific to macOS are different findings.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The declared floor and the version ci already uses.
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Actions checkout is the CI equivalent of the README's `git clone`.
      # Select the matrix interpreter, then run the documented installer.
      - name: quick start — install
        env:
          RVND_INSTALL_PYTHON: python
        run: ./server/install.sh

      # The canary. `mcp` is a required runtime dependency and five modules
      # import FastMCP at module scope, so this is the first thing an upstream
      # major would break, and it fails before any test collection would.
      - name: resolved runtime imports
        run: |
          .venv/bin/python - <<'PY'
          import importlib.metadata as md
          print("mcp:", md.version("mcp"))
          print("rvnd:", md.version("rvnd"))
          import mcp.server.fastmcp          # noqa: F401
          import workspaces.mcp_server       # noqa: F401
          import workspaces.gateway          # noqa: F401
          print("imports OK")
          PY

      # Exit 0 means every console script's interpreter can import the
      # package. Each CI step starts a fresh shell, so this also keeps the
      # doctor honest about an unactivated install.
      - name: console-script bindings
        run: .venv/bin/workspaces-doctor

      # The README's stated outcome: the Patchbay console answers on 8799.
      - name: patchbay serves
        run: |
          .venv/bin/python app/serve.py &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          code="$(curl -sS -o body.html -w '%{http_code}' \
                    --retry 20 --retry-delay 1 --retry-connrefused \
                    --max-time 60 http://127.0.0.1:8799/)"
          echo "HTTP $code, $(wc -c < body.html) bytes"
          test "$code" = "200"
          grep -q "Rvnd" body.html

      # Only on failure, and only the resolved set — enough to see which
      # upstream moved without keeping an artifact per green run.
      - name: resolved dependency set (on failure)
        if: failure()
        run: .venv/bin/python -m pip freeze
