# Shared-host invariant: the agent account has no non-loopback TCP/UDP egress.
# `quick` is load-bearing because pf is last-match-wins.

set skip on lo0
block return out quick proto { tcp, udp } user @AGENT_USER@

# Dedicated-host alternative (intentionally not enabled here):
# block return out all
# pass out quick proto { tcp, udp } user @PROXY_USER@ keep state
