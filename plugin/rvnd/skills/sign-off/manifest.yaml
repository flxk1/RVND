# Loomground manifest for sign-off.
# Conducts a human decision for a withheld activation. It reads the pending
# decisions the engine produced off the shared graph and never proposes policy
# of its own - it does not change the original Loomground verdict; a release
# becomes a fresh activation with its own token and trace.
name: sign-off
loomground_governance: 0.8.2
cascade: local-first   # reads the engine's precise, signable pending decision when present; else the coarse, advisory upstream graph (degraded, unsigned until the engine ratifies)
loomground:
  reads:
    - reservation
    - quorum
    - redress
    - autonomy-grade
    - party
    - human
    - gate
    - egress-obligation
  proposes: []                    # conducts a decision; proposes no constructs
  never_applies_directly: true
# Real MCP surface (verified). Two decision modes preserved: ratification (approve/deny)
# vs residual origination (>=2 unranked alternatives). Whether a decision COUNTS is the
# projection's call. See ../../references/catalogue.md.
rvnd:
  discovery: workspace_workflow(op="help")
  tools:
    - tool: workspace_workflow
      ops: [approval_request, approval_decide, approval_resolve, approval_delegate, approval_list, governance_query]
confirmation:
  mutations: required
