name: resolve-a-conflict
loomground_governance: 0.8.2
cascade: local-first
loomground:
  reads: [actor, human, gate, authority, reservation, quorum, prohibition, temporal, redress, party, delegation, autonomy-grade]
  proposes: [authority, reservation, quorum, prohibition, temporal, redress, delegation, autonomy-grade]
  never_applies_directly: true
rvnd:
  discovery: workspace_workflow(op="help")
  tools:
    - tool: workspace_workflow
      ops: [governance_graph, governance_lane_list, governance_netlist, patch_validate]
confirmation:
  mutations: required-via-govern-an-action
