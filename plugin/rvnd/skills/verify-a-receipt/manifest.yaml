# Loomground manifest for verify-a-receipt.
# Inspects and verifies governance behaviour. Verification is observational in
# purpose but appends an audit-of-audit event to the signed chain. It reads the policy
# graph, the activation token, the ordered evaluation trace, the effective and
# terminal verdicts, and the delegation/principal chain. It proposes nothing and
# never applies.
name: verify-a-receipt
cascade: local-first
loomground_governance: 0.8.2
loomground:
  reads:
    - actor
    - human
    - gate
    - master
    - authority
    - pipe
    - egress
    - reservation
    - quorum
    - prohibition
    - egress-obligation
    - redress
    - party
    - delegation
    - autonomy-grade
  proposes: []
  never_applies_directly: true
  read_only: false
# Real MCP surface (verified). See ../../references/catalogue.md.
rvnd:
  discovery: workspace_audit(op="help")
  tools:
    - tool: workspace_audit
      ops: [verify_chain, get_event, discipline]
    - tool: workspace_workflow
      ops: [governance_graph, loop_graph]
confirmation:
  mutations: required             # verification appends an audit-of-audit event
