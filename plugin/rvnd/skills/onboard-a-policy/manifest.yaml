# Loomground manifest for onboard-a-policy.
# Brings a written policy/regulation/contract into governance by lowering it into the
# shared dimensioned Subgraph through the loomground ingest plane, then handing the
# validated graph to sign-off. Consumes the planes; never regrows a lowering; never
# applies or signs (applying is a separate governed step).
name: onboard-a-policy
loomground_governance: 0.8.3
loomground:
  reads:
    - actor
    - human
    - gate
    - master
    - authority
    - reservation
    - quorum
    - prohibition
    - obligation
    - temporal
    - egress-obligation
    - redress
    - party
    - delegation
    - autonomy-grade
  proposes:
    - reservation
    - prohibition
    - obligation
    - redress
  never_applies_directly: true
  read_only: false
# Delegates the lowering to the free loomground-marketplace plane SKILLS — the lowering is theirs,
# not this skill's. This skill orchestrates and assembles; it never re-authors a plane's job.
delegates_to:
  ingest: loomground-ingest        # drive the network-free ingest plane -> a dimensioned Subgraph
  deontic: deontic                 # loomground-deontic: each norm -> a verified DeonticFormula (O/P/F, incidents)
  governance: loomground           # loomground-governance: the governance .lg patch + express/policy/host litmus
# Underlying planes those skills stand on (installed packages, for reference only).
consumes_packages:
  legal: loomground_legal          # Anchor / ApplicableLaw / Citation — source hierarchy, precedence
  factual: loomground_factual
  epistemic: loomground_epistemic
cascade: local-first   # engine lowering when present; else DELEGATE to the plane skills + in-grammar enrichment
# Real MCP surface used when the engine IS present (verified names). See ../../references/catalogue.md.
rvnd:
  discovery: workspace_workflow(op="help")
  tools:
    - tool: workspace_workflow
      ops: [policy_ingest, governance_netlist, patch_validate]
confirmation:
  mutations: none        # onboarding ends at a validated graph; applying/signing is sign-off + the engine
